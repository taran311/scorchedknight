name: scorchedknight
description: Scorched Knight - survive the ashfall, slay the flame. A cartoony turn-based fantasy RPG.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.6.0
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.0
  google_fonts: ^6.2.0
  # Cloud saves (services/cloud.dart): Google sign-in and the save in Firestore.
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
